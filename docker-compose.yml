services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - GO2RTC_URL=http://127.0.0.1:1984
    depends_on:
      - go2rtc
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./users.json:/app/users.json
      - ./cameras.json:/app/cameras.json

  go2rtc:
    image: alexxit/go2rtc
    env_file:
      - .env
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    restart: unless-stopped
    network_mode: host
