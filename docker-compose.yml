services:
  app:
    build: .
    ports:
      - "8888:80"
      - "9900-9910:9900-9910"
    env_file:
      - .env
      - .env.secret
    environment:
      - GO2RTC_URL=http://go2rtc:1984
    depends_on:
      - go2rtc
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    restart: unless-stopped
